name: Project-local adapter

on:
  push:
    branches: [dev, main]
  pull_request:
    branches: [dev, main]

permissions:
  contents: read

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        node-version: [22]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      - run: npm run check

      - run: npm run test:project-local

      # A dry run exercises argument parsing, project-root resolution, conflict
      # detection and the MCP writers without leaving anything on the runner.
      - name: Rehearse an install
        shell: bash
        run: |
          target="${RUNNER_TEMP}/adapter-dry-run"
          mkdir -p "$target"
          git -C "$target" init -q
          node adapters/project-local/install.mjs \
            --project "$target" --platform both --dry-run
